name: yiclass
description: YIClass Android · 课表、待办与日程
publish_to: none
version: 3.3.0+330
environment:
  sdk: ">=3.8.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.5
  http: ^1.5.0
  file_picker: ^10.3.3
  flutter_secure_storage: ^9.2.4
  share_plus: ^12.0.1
  cross_file: ^0.3.5
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.1
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - LICENSE
    - assets/fonts/OFL.txt
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
