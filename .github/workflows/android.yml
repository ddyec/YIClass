name: Android review build
on:
  push:
    branches: [main, 'android/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: 1 - Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YIClass-Android-UI-review
          path: /tmp/yiclass-review/*.png
          if-no-files-found: ignore
  apk:
    name: 2 - Build APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/YIClass-Android-3.3.0-review.apk
          sha256sum dist/*.apk > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        id: apk
        with:
          name: YIClass-Android-3.3.0-APK
          path: dist/
          retention-days: 30
      - run: echo 'APK download：${{ steps.apk.outputs.artifact-url }}' >> "$GITHUB_STEP_SUMMARY"
