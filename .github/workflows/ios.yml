name: iOS unsigned app with WidgetKit
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Main app bundle identifier
        default: com.ddyec.yiclass
        required: true
      app_group:
        description: Shared App Group (empty uses group.bundle_id)
        default: ''
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: flutter pub get
      - run: dart analyze lib/services/ai lib/views/ai/planning_page.dart lib/views/ai/import_review_page.dart lib/services/ios_widget_service.dart test
      - run: flutter test
  build:
    needs: verify
    runs-on: macos-15
    env:
      BUNDLE_ID: ${{ inputs.bundle_id || 'com.ddyec.yiclass' }}
      APP_GROUP_INPUT: ${{ inputs.app_group }}
      APP_VERSION: 2.4.1
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify PDF weekday extraction including rotated pages
        run: |
          swiftc ios/Runner/PdfTimetableReader.swift scripts/tests/pdf_reader/main.swift -o "$RUNNER_TEMP/pdf-reader-test"
          "$RUNNER_TEMP/pdf-reader-test"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: flutter pub get
      - name: Add embedded WidgetKit target and signing entitlements
        run: |
          export APP_GROUP="${APP_GROUP_INPUT:-group.$BUNDLE_ID}"
          ruby scripts/configure_ios.rb
          ruby scripts/configure_ios.rb
          plutil -lint ios/Runner/Info.plist ios/ScheduleWidget/Info.plist
      - run: flutter build ios --release --no-codesign --build-name "$APP_VERSION" --build-number "$BUILD_NUMBER"
      - name: Verify extension and package unsigned IPA
        run: |
          python3 scripts/verify_ios_bundle.py build/ios/iphoneos/Runner.app
          rm -rf build/unsigned build/artifacts build/ipa-check
          mkdir -p build/unsigned/Payload build/artifacts
          cp -R build/ios/iphoneos/Runner.app build/unsigned/Payload/
          (cd build/unsigned && /usr/bin/zip -qry ../artifacts/YIClass-unsigned.ipa Payload)
          /usr/bin/unzip -tq build/artifacts/YIClass-unsigned.ipa
          /usr/bin/unzip -q build/artifacts/YIClass-unsigned.ipa -d build/ipa-check
          python3 scripts/verify_ios_bundle.py build/ipa-check/Payload/Runner.app
          cp docs/IOS-SIGNING.md build/artifacts/
          (cd build/artifacts && shasum -a 256 YIClass-unsigned.ipa > SHA256SUMS.txt)
          rm -rf build/unsigned build/ipa-check
      - name: Explain artifact download
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## iOS 下载与校验
          下载 **YIClass-iOS-unsigned-with-widget** 产物后，先解压 GitHub 提供的 ZIP。
          解压后根目录的 **YIClass-unsigned.ipa** 才是待签名安装包；不要把外层 ZIP 改名为 IPA。
          IPA 已通过 ZIP 完整性检查和解压后的小组件校验。
          可用同目录的 SHA256SUMS.txt 校验下载文件：`shasum -a 256 -c SHA256SUMS.txt`。
          签名要求见同目录 IOS-SIGNING.md。
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: YIClass-iOS-unsigned-with-widget
          path: build/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-build-diagnostics
          path: |
            ios/Runner.xcodeproj/project.pbxproj
            ios/Podfile.lock
